name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          # setup-node caches the pnpm store by default, but only on an exact
          # lockfile hash. Caching it below instead adds a restore-key fallback,
          # so a changed lockfile reuses every package that did not change.
          package-manager-cache: false

      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # The image carries no toolchain, so the production tree is assembled here
      # and only copied in. pnpm deploy resolves the workspace link to
      # @obsidian-sync/protocol into a real dependency.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @obsidian-sync/protocol build
      - run: pnpm --filter @obsidian-sync/server build
      - run: pnpm deploy --filter @obsidian-sync/server --prod out

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/obsidian-sync-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # No RUN instructions execute, so both architectures build from the one
      # tree without emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugin-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          # setup-node caches the pnpm store by default, but only on an exact
          # lockfile hash. Caching it below instead adds a restore-key fallback,
          # so a changed lockfile reuses every package that did not change.
          package-manager-cache: false

      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @obsidian-sync/protocol build
      - run: pnpm --filter @obsidian-sync/plugin build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/plugin/main.js
            packages/plugin/manifest.json
            packages/plugin/styles.css
